<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 144 144" fill="none">
  <defs>
    <!-- Regular hexagon hub, circumradius R = 12 -->
    <polygon
      id="hub"
      points="
        0,-12
        10.392305,-6
        10.392305,6
        0,12
        -10.392305,6
        -10.392305,-6
      "
    />

    <!--
      Top arm basis:
      radial unit u = (0,-1)
      slant unit  v = (-1/sqrt(2), -1/sqrt(2))
    -->

    <!-- Primary 1
         radial edge: [1.25R, 2R]
         radial length L = 0.75R = 9
         slant length  S = 0.375R = 4.5 -->
    <polygon
      id="primary-1"
      points="
        0,-15
        -3.181981,-18.181981
        -3.181981,-27.181981
        0,-24
      "
    />

    <!-- Primary 2
         radial edge: [2.25R, 3R]
         radial length L = 9
         slant length  S = 1.125R = 13.5 -->
    <polygon
      id="primary-2"
      points="
        0,-27
        -9.545942,-36.545942
        -9.545942,-45.545942
        0,-36
      "
    />

    <!-- Primary 3
         radial edge: [3.25R, 4R]
         radial length L = 9
         slant length  S = 13.5 -->
    <polygon
      id="primary-3"
      points="
        0,-39
        -9.545942,-48.545942
        -9.545942,-57.545942
        0,-48
      "
    />

    <!-- Secondary arm placeholder -->
    <polygon
      id="secondary-arm"
      points="
        8.25,-14.289
        5.921,-22.983
        12.671,-34.674
        15,-25.98
      "
    />
  </defs>

  <circle cx="0" cy="0" r="72" fill="#ffffff" />

  <g fill="#000000">
    <!-- Center hub -->
    <use href="#hub" />

    <!-- 6 primary arms -->
    <use href="#primary-1" />
    <use href="#primary-2" />
    <use href="#primary-3" />
    <use href="#primary-1" transform="rotate(60)" />
    <use href="#primary-2" transform="rotate(60)" />
    <use href="#primary-3" transform="rotate(60)" />
    <use href="#primary-1" transform="rotate(120)" />
    <use href="#primary-2" transform="rotate(120)" />
    <use href="#primary-3" transform="rotate(120)" />
    <use href="#primary-1" transform="rotate(180)" />
    <use href="#primary-2" transform="rotate(180)" />
    <use href="#primary-3" transform="rotate(180)" />
    <use href="#primary-1" transform="rotate(240)" />
    <use href="#primary-2" transform="rotate(240)" />
    <use href="#primary-3" transform="rotate(240)" />
    <use href="#primary-1" transform="rotate(300)" />
    <use href="#primary-2" transform="rotate(300)" />
    <use href="#primary-3" transform="rotate(300)" />

    <!-- 6 secondary arms -->
    <use href="#secondary-arm" />
    <use href="#secondary-arm" transform="rotate(60)" />
    <use href="#secondary-arm" transform="rotate(120)" />
    <use href="#secondary-arm" transform="rotate(180)" />
    <use href="#secondary-arm" transform="rotate(240)" />
    <use href="#secondary-arm" transform="rotate(300)" />
  </g>
</svg>
